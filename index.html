<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI训练师三级 · 代码填空</title>
<style>
:root{--primary:#4361ee;--primary-light:#eef0ff;--success:#10b981;--success-bg:#ecfdf5;--danger:#ef4444;--danger-bg:#fef2f2;--code-bg:#1e1e2e;--card:#fff;--bg:#f0f2f5;--text:#1a1a2e;--text2:#6b7280;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.header{background:var(--primary);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:50}
.header h1{font-size:17px;font-weight:600}
.header .sub{font-size:12px;opacity:.8;margin-top:2px}
.nav{display:flex;background:var(--card);border-bottom:1px solid #e5e7eb;position:sticky;top:49px;z-index:49}
.nav button{flex:1;padding:10px 0;background:none;border:none;font-size:13px;font-weight:500;color:var(--text2);position:relative;cursor:pointer;transition:.2s}
.nav button.active{color:var(--primary);font-weight:600}
.nav button.active::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:3px;background:var(--primary);border-radius:3px 3px 0 0}
.panel{display:none;padding:0}
.panel.active{display:block}
.progress-wrap{padding:8px 16px;background:var(--card);display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text2)}
.progress-bar{flex:1;height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--primary);border-radius:3px;transition:width .4s;width:0%}
.ex-grid{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.ex-btn{padding:8px 14px;border:1.5px solid #d1d5db;border-radius:20px;background:var(--card);font-size:13px;color:var(--text2);cursor:pointer;transition:.2s;white-space:nowrap}
.ex-btn.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:600}
.ex-btn.done{border-color:var(--success);color:var(--success)}
.ex-btn .pct{font-size:10px;opacity:.7}
.ch-section{padding:12px 16px 4px;font-weight:600;font-size:14px;color:var(--text)}
.dsinfo{margin:8px 16px;padding:8px 12px;background:var(--card);border-radius:var(--radius);font-size:12px;color:var(--text2);box-shadow:var(--shadow);border-left:3px solid var(--primary);display:none}
.cell{margin:8px 16px;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.cell-hdr{padding:8px 14px;background:#f9fafb;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.cell-hdr .label{color:var(--text2);font-weight:500}
.cell-hdr .info{color:var(--primary);font-size:11px;font-weight:600}
.cell-hint{padding:8px 14px;font-size:12px;color:var(--text2);border-bottom:1px solid #eef0f2;background:#fffbeb;line-height:1.5}
.cell-hint strong{color:var(--text)}
.code{padding:14px;background:var(--code-bg);overflow-x:auto;font-family:"SF Mono","Fira Code","Cascadia Code",Consolas,monospace;font-size:13.5px;line-height:1.9;color:#e2e8f0;-webkit-overflow-scrolling:touch}
.code .line{white-space:pre-wrap;word-break:break-word}
.ci{display:inline-block;max-width:90%;padding:0 5px;margin:-1px 0;border:none;border-bottom:2px solid #6366f1;background:rgba(99,102,241,.12);color:#fbbf24;font-family:inherit;font-size:inherit;line-height:inherit;outline:none;transition:.2s;caret-color:#fbbf24}
.ci:focus{background:rgba(99,102,241,.25);border-bottom-color:#818cf8}
.ci.correct{background:rgba(16,185,129,.18);border-bottom-color:var(--success);color:#34d399}
.ci.wrong{background:rgba(239,68,68,.18);border-bottom-color:var(--danger);color:#f87171;text-decoration:line-through}
.ci.revealed{background:rgba(16,185,129,.12);border-bottom-color:var(--success);color:#34d399}
.acts{padding:8px 14px;display:flex;gap:8px;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;text-align:center}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--primary);color:#fff}
.btn-p:disabled{opacity:.35;cursor:default;transform:none}
.btn-s{background:var(--success);color:#fff}
.btn-o{background:none;border:1.5px solid var(--primary);color:var(--primary)}
.btn-d{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.fb{padding:10px 14px;font-size:12px;line-height:1.6;display:none;border-top:1px solid #e5e7eb}
.fb.show{display:block}
.fb.ok{background:var(--success-bg);color:#065f46}
.fb.err{background:var(--danger-bg);color:#991b1b}
.exam-card{margin:8px 16px;padding:20px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);text-align:center}
.exam-card h2{font-size:18px;margin-bottom:4px}
.exam-card p{color:var(--text2);font-size:13px}
.exam-opts label{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;margin-bottom:6px;font-size:14px;cursor:pointer}
.exam-opts input[type=radio]{accent-color:var(--primary);width:16px;height:16px}
.exam-result{display:none}
.exam-result.show{display:block}
.score-box{text-align:center;padding:30px 20px}
.score-box .num{font-size:48px;font-weight:800;color:var(--primary)}
.score-box .lbl{font-size:13px;color:var(--text2);margin-top:4px}
.score-box .detail{display:flex;justify-content:center;gap:20px;margin-top:16px;font-size:13px}
.score-box .detail .v{font-size:20px;font-weight:700}
.score-box .detail .ok .v{color:var(--success)}
.score-box .detail .no .v{color:var(--danger)}
.stats{display:flex;gap:6px;padding:8px 16px;background:var(--card);overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid #e5e7eb}
.stats::-webkit-scrollbar{display:none}
.stats .s{flex-shrink:0;text-align:center;padding:4px 12px;border-radius:6px;background:var(--primary-light);font-size:11px;color:var(--text2)}
.stats .s .n{display:block;font-size:16px;font-weight:700;color:var(--primary)}
.rv-item{padding:12px 0;border-bottom:1px solid #eef0f2;font-size:13px}
.rv-item:last-child{border-bottom:none}
.rv-item .q{font-weight:500;margin-bottom:4px}
.rv-item .a{color:var(--success)}
.rv-empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}
.ta-center{text-align:center}
.mt-16{margin-top:16px}
.hidden{display:none!important}
.wrap{flex-wrap:wrap}
.flex{display:flex}
.gap-8{gap:8px}
.ch-filt{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-bottom:1px solid #e5e7eb}
.ch-filt::-webkit-scrollbar{display:none}
.ch-filt button{flex-shrink:0;padding:5px 12px;border:1px solid #d1d5db;border-radius:16px;background:var(--card);font-size:12px;color:var(--text2);cursor:pointer}
.ch-filt button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>

<div class="header"><h1>⌨️ AI训练师三级 · 代码填空</h1><div class="sub">基于官方答案标准 · 共 <span id="totalBlanks">0</span> 个填空</div></div>
<div class="nav">

    </div>
  </div>
</div>
<div class="panel" id="pn-stars"><div id="starsList" style="padding:12px 16px"></div></div>

</div>

const KEY='ai3_code_v2';let S=loadState();

function allBlanks(){return EX.reduce((s,e)=>s+e.cells.reduce((s2,c)=>s2+c.b.length,0),0)}
function sanitize(s){return s.trim().replace(/\s+/g,' ').replace(/["""]/g,'"').replace(/[''']/g,"'")}
function check(u,b){u=sanitize(u);if(!u)return false;let all=[sanitize(b.a),...(b.alt||[]).map(sanitize)];if(all.includes(u))return true;return false}

let curEx=null;

function renderExGrid(ch=0){let h='',lc=0;EX.forEach((ex,i)=>{if(ch&&ex.ch!==ch)return;if(ex.ch!==lc){h+=`<div class="ch-section">第${ex.ch}章</div>`;lc=ex.ch}const t=ex.cells.reduce((s,c)=>s+c.b.length,0),d=countDone(ex);let c='ex-btn';if(i===curEx)c+=' active';else if(d===t)c+=' done';h+=`<button class="${c}" onclick="openEx(${i})">${ex.id}<span class="pct"> ${d}/${t}</span></button>`});document.getElementById('exGrid').innerHTML=h}
function countDone(ex){let n=0;ex.cells.forEach((c,ci)=>{c.b.forEach((_,bi)=>{if(S.d[ex.id+'-'+ci+'-'+bi]!==undefined)n++})});return n}

const area=document.getElementById('cellArea'),comp=document.getElementById('completeMsg');let allDone=true,h='';ex.cells.forEach((cell,ci)=>{let cellDone=true;cell.b.forEach((_,bi)=>{if(S.d[ex.id+'-'+ci+'-'+bi]===undefined)cellDone=false});if(!cellDone)allDone=false
h+=`<div class="cell" id="c-${ci}"><div class="cell-hdr"><span class="label">In [${ci+1}]</span><span class="info">${cell.b.length}空${cellDone?' ✅':''}</span></div>`;if(cell.hint)h+=`<div class="cell-hint">💡 ${cell.hint}</div>`;h+=`<div class="code">${renderTpl(cell.t,ex.id,ci,cell.b)}</div>`
h+=`<div class="acts">`;const af=cell.b.every((_,bi)=>S.d[ex.id+'-'+ci+'-'+bi]!==undefined);h+=`<button class="btn btn-o btn-sm" id="rv-${ci}" onclick="revealCell(${ci})">答案</button>`;h+=`<button class="btn btn-o btn-sm" id="rs-${ci}" onclick="resetCell(${ci})">重做错题</button><button class="btn btn-o btn-sm" id="rsa-${ci}" onclick="resetCellAll(${ci})">重置全部</button></div>`
h+=`<div class="fb" id="fb-${ci}"></div></div>`});area.innerHTML=h;comp.style.display=allDone?'block':'none';updateStats()}
function renderTpl(tpl,exId,ci,blanks){let lines=Array.isArray(tpl)?tpl.join('\n'):tpl;return lines.replace(/___(\d+)___/g,(m,idx)=>{const bi=parseInt(idx);if(bi>=blanks.length)return m;const b=blanks[bi],key=exId+'-'+ci+'-'+bi;const saved=S.d[key];const val=saved?sanitize(saved):'';const w=Math.max(60,b.a.length*8.5+16);let cls='ci';if(saved!==undefined){cls+=check(sanitize(saved),b)?' correct':' wrong'};return `<input class="${cls}" id="i-${key}" data-ex="${exId}" data-ci="${ci}" data-bi="${bi}" type="text" value="${val}" ${saved!==undefined?'readonly':''} style="min-width:${w}px" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><span onclick="event.stopPropagation();toggleStar('${exId}',${ci},${bi})" style="cursor:pointer;font-size:15px;margin-left:1px;user-select:none">${S.s.includes(exId+'-'+ci+'-'+bi)?'⭐':'☆'}</span>`}).split('\n').map(line=>`<div class="line">${line}</div>`).join('')}

function checkOne(inp){const key=inp.id.replace('i-','');const p=key.split('-');if(p.length<3)return;const ex=EX.find(e=>e.id===p[0]);if(!ex)return;const ci=parseInt(p[1]),bi=parseInt(p[2]);if(!ex.cells[ci]||!ex.cells[ci].b[bi])return;const b=ex.cells[ci].b[bi];const val=sanitize(inp.value);if(!val)return;const ok=check(val,b);S.d[key]=inp.value;inp.value=sanitize(inp.value);inp.readOnly=true;inp.classList.remove('wrong','correct');inp.classList.add(ok?'correct':'wrong');if(!ok&&!S.w.includes(key))S.w.push(key);else if(ok)S.w=S.w.filter(k=>k!==key);saveState();renderExGrid();updateStats();const fb=document.getElementById('fb-'+ci);if(fb){const cell=EX.find(e=>e.id===p[0]).cells[ci];const total=cell.b.length,solved=cell.b.filter((_,bi)=>S.d[p[0]+'-'+ci+'-'+bi]!==undefined).length;fb.textContent=ok?'✅ 正确':'❌ 正确答案：'+b.a;fb.className='fb show '+(ok?'ok':'err')}}

function startExam(){const cnt=parseInt(document.querySelector('input[name="ec"]:checked').value);let pool=[];EX.forEach(ex=>{ex.cells.forEach((cell,ci)=>{cell.b.forEach((b,bi)=>{pool.push({ex,cell,ci,bi,b,key:ex.id+'-'+ci+'-'+bi,exId:ex.id})})})});for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}if(cnt>0)pool=pool.slice(0,cnt);examItems=pool;examIdx=0;examOk=0;examNo=0;examAnswers=[];document.getElementById('examSetup').style.display='none';document.getElementById('examArea').classList.remove('hidden');document.getElementById('examResult').classList.remove('show');showExamItem()}

let h=`<div class="cell"><div class="cell-hdr"><span class="label">📝 第${examIdx+1}/${examItems.length}题</span><span class="info">${item.exId}</span></div><div class="cell-hint"><strong>当前填空：</strong>${item.ex.title}</div><div class="code">${result}</div><div class="acts"><button class="btn btn-p" id="examSubBtn">提交</button></div><div class="fb" id="examFb"></div></div>`;document.getElementById('examCell').innerHTML=h;document.getElementById('examProg').textContent=`${examIdx+1}/${examItems.length}`;document.getElementById('examFill').style.width=((examIdx)/examItems.length*100)+'%';document.getElementById('examSubBtn').onclick=submitExamItem;const ei=document.getElementById('examInput');if(ei)ei.focus()}
function submitExamItem(){const inp=document.getElementById('examInput');if(!inp||!inp.value.trim()){document.getElementById('examFb').textContent='⚠️ 请先填写代码';document.getElementById('examFb').className='fb show err';return}const item=examItems[examIdx];const val=sanitize(inp.value);const ok=check(val,item.b);inp.readOnly=true;inp.classList.add(ok?'correct':'wrong');if(!ok){inp.value=item.b.a;examNo++;if(!S.w.includes(item.key))S.w.push(item.key)}else{examOk++;S.w=S.w.filter(k=>k!==item.key)}S.d[item.key]=inp.value;saveState();examAnswers.push({item,user:val,correct:ok})
document.getElementById('examFb').textContent=ok?'✅ 正确！':`❌ 正确答案：${item.b.a}`;document.getElementById('examFb').className='fb show '+(ok?'ok':'err');document.getElementById('examSubBtn').textContent='下一题';document.getElementById('examSubBtn').onclick=()=>{examIdx++;showExamItem()};updateStats()}
function finishExam(){document.getElementById('examCell').innerHTML='';document.getElementById('examResult').classList.add('show');document.getElementById('examProg').textContent='完成';document.getElementById('examFill').style.width='100%';const t=examOk+examNo,p=t>0?Math.round(examOk/t*100):0;document.getElementById('examScore').textContent=p+'%';document.getElementById('examOk').textContent=examOk;document.getElementById('examNo').textContent=examNo;document.getElementById('examReviewBtn').style.display=examNo>0?'inline-block':'none'}
function reviewExam(){document.getElementById('examReviewList').innerHTML=examAnswers.filter(a=>!a.correct).map(a=>`<div class="rv-item"><div class="q">${a.item.exId} · ${a.item.ex.title}</div><div class="a">✅ ${a.item.b.a}</div><div style="color:var(--danger)">❌ 你的答案：${a.user||'未填写'}</div></div>`).join('')}
function renderWrong(){const el=document.getElementById('wrongList');if(S.w.length===0){el.innerHTML='<div class="rv-empty">🎉 暂无错题</div>';return}const items=S.w.map(k=>{const p=k.split('-');if(p.length<3)return null;const ex=EX.find(e=>e.id===p[0]);if(!ex)return null;try{const ci=parseInt(p[1]),bi=parseInt(p[2]);if(!ex.cells[ci]||!ex.cells[ci].b[bi])return null;const b=ex.cells[ci].b[bi];return{exId:ex.id,title:ex.title,b,user:S.d[k]}}catch(e){return null}}).filter(Boolean);el.innerHTML=items.map(i=>`<div class="rv-item"><div class="q">${i.exId} · ${i.title}</div><div class="a">✅ ${i.b.a}</div><div style="color:var(--danger);font-size:12px">你的答案：${sanitize(i.user||'')}</div></div>`).join('')}
function renderStars(){var el=document.getElementById('starsList');if(!S.s.length){el.innerHTML='<div class="rv-empty">\u8fd8\u6ca1\u6709\u6807\u8bb0\u96be\u70b9<br>\u586b\u7a7a\u65c1\u8fb9\u7684 \u2606 \u53ef\u6807\u8bb0</div>';return}var out='';for(var i=0;i<S.s.length;i++){var key=S.s[i];var p=key.split('-');if(p.length<3)continue;var ex=null;for(var j=0;j<EX.length;j++){if(EX[j].id===p[0]){ex=EX[j];break}}if(!ex)continue;var ci=parseInt(p[1]),bi=parseInt(p[2]);if(!ex.cells[ci]||!ex.cells[ci].b[bi])continue;var cell=ex.cells[ci];var b=cell.b[bi];var done=S.d[key]!==undefined?1:0;out+='<div class="cell"><div class="cell-hdr"><span class="label">'+ex.id+' - \u5355\u5143\u683c'+(ci+1)+' - \u7a7a'+(bi+1)+'</span><span class="info">'+(done?'\u5df2\u505a':'\u672a\u505a')+'</span></div><div class="cell-hint">\u4ee3\u7801: '+b.a+'</div><div class="acts"><button class="btn btn-p btn-sm" onclick="openEx('+EX.indexOf(ex)+')">\u53bb\u7ec3\u4e60</button><button class="btn btn-o btn-sm" onclick="S.s=S.s.filter(function(x){return x!==key});saveState();renderStars();renderExGrid()">\u53d6\u6d88\u6807\u8bb0</button></div></div>'}el.innerHTML=out}
document.querySelectorAll('.nav button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active')});this.classList.add('active');document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});document.getElementById('pn-'+this.dataset.tab).classList.add('active');updateStats();if(this.dataset.tab==='wrongbook')renderWrong();if(this.dataset.tab==='stars')renderStars()})})
document.getElementById('examStartBtn').addEventListener('click',startExam)
document.getElementById('examReviewBtn').addEventListener('click',reviewExam)
document.getElementById('examAgainBtn').addEventListener('click',()=>{document.getElementById('examSetup').style.display='block';document.getElementById('examArea').classList.add('hidden');document.getElementById('examResult').classList.remove('show')})
document.getElementById('clearWrongBtn').addEventListener('click',()=>{if(S.w.length===0||!confirm('清空错题本？'))return;S.w=[];saveState();renderWrong();updateStats()})
renderChFilt();renderExGrid();updateStats();
</script>
</body>
</html>
